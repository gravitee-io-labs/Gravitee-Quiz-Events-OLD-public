# Gravitee Quiz Events - local gateway (docker compose only)
#
# Mirrors the production ingress (k8s/ingress.yaml) so dev and prod behave the same:
#   /api/...   -> backend:8000        (path preserved, /api prefix kept)
#   /admin...  -> admin-console:80    (path preserved)
#   /          -> web:80              (hub, /{slug}, /{slug}/scoreboard, static)
#
# Everything is same-origin on one port: no CORS, no per-app ports.
# Mounted by docker-compose.yml as /etc/nginx/conf.d/default.conf.

server_tokens off;

# Docker's embedded DNS. Upstreams are resolved per request (variables in proxy_pass below), so
# nginx neither fails at start when a service is not up yet nor keeps a stale IP after a
# container is recreated (docker compose up --build, backend --reload crashes, ...).
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    # CSV imports and event bundles (the ingress uses the same 10m limit).
    client_max_body_size 10m;

    set $backend_upstream backend:8000;
    set $admin_upstream   admin-console:80;
    set $web_upstream     web:80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # --- Scoreboard live stream (SSE): no buffering, no compression, long-lived ----------
    location ~ ^/api/events/[^/]+/scoreboard/stream/?$ {
        proxy_pass http://$backend_upstream;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- API (no URI part in proxy_pass: the original /api/... URI is forwarded unchanged) ---
    location ~ ^/api(/|$) {
        proxy_pass http://$backend_upstream;
    }

    # --- Admin console ---------------------------------------------------------------------
    location = /admin {
        proxy_pass http://$admin_upstream;
    }
    location ^~ /admin/ {
        proxy_pass http://$admin_upstream;
    }

    # --- Everything else: player web app ---------------------------------------------------
    location / {
        proxy_pass http://$web_upstream;
    }
}
