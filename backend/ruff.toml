line-length = 100
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is the idiom
    "E501",  # long lines in docstrings/seed text are fine
    "UP007", # keep Optional[...] readable for FastAPI/Pydantic users
    "UP045",
    "UP017", # datetime.timezone.utc is explicit and readable
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
