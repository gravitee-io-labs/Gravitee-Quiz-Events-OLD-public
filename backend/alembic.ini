# Alembic configuration for Gravitee Quiz Events.
#
# Normally migrations run automatically at application start-up (app.migrate.run_migrations, under a
# PostgreSQL advisory lock). For manual use, from the backend/ directory:
#
#   DATABASE_URL=postgresql://user:pass@host:5432/db  alembic current
#   DATABASE_URL=...                                  alembic upgrade head
#
# The database URL is NOT stored here: app.migrate injects settings.DATABASE_URL, and alembic/env.py
# falls back to the DATABASE_URL environment variable / app settings for CLI use.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
