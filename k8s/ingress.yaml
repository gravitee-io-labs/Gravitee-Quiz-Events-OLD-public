# One public host, three Prefix paths (no regex). The longest prefix wins, so /api and /admin are
# served by their backends and everything else falls through to the web app.
#   https://quiz.events.gravitee.io/        -> quiz-web
#   https://quiz.events.gravitee.io/admin   -> quiz-admin-console
#   https://quiz.events.gravitee.io/api     -> quiz-backend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quiz-ingress
  namespace: quiz-game
  labels:
    app.kubernetes.io/name: quiz-ingress
    app.kubernetes.io/part-of: gravitee-quiz
  annotations:
    # cert-manager issues the certificate into the secret named under spec.tls
    cert-manager.io/cluster-issuer: "google-ca-http01"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # CSV imports and event bundles
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # The scoreboard stream (SSE, /api/events/{slug}/scoreboard/stream) is a long-lived response:
    # the default 60 s timeout would cut every big-screen connection once a minute.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - quiz.events.gravitee.io
      secretName: quiz-events-tls
  rules:
    - host: quiz.events.gravitee.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: quiz-backend
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: quiz-admin-console
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quiz-web
                port:
                  number: 80
