apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-web
  namespace: quiz-game
  labels:
    app.kubernetes.io/name: quiz-web
    app.kubernetes.io/part-of: gravitee-quiz
spec:
  # Static nginx, the entry point of every player. One replica (rolling updates keep it available);
  # scale to 2 for extra resilience: `kubectl scale deploy/quiz-web --replicas=2`.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: quiz-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quiz-web
        app.kubernetes.io/part-of: gravitee-quiz
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: quiz-web
      containers:
        - name: web
          image: dobl1/quiz-web:2.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: quiz-frontend-config
                  key: API_BASE_URL
            # Optional: a ConfigMap without the key (older apply) leaves the QR on location.origin.
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: quiz-frontend-config
                  key: PUBLIC_BASE_URL
                  optional: true
          # Every player loads the app within seconds of the doors opening (gzip on the fly costs CPU):
          # a generous CPU limit keeps the health probes answering while the crowd arrives.
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "1000m"
          # nginx:alpine starts as root to bind port 80 and runs its workers as "nginx":
          # keep only the capabilities that needs.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          # Keep serving for a few seconds after the pod is marked terminating: the ingress needs a
          # moment to drop it from its endpoints (no failed requests during a rolling update).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-web
  namespace: quiz-game
  labels:
    app.kubernetes.io/name: quiz-web
    app.kubernetes.io/part-of: gravitee-quiz
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: quiz-web
