# REFERENCE ONLY - never apply this file as is, and it is NOT part of kustomization.yaml.
# (kubectl apply would replace the live secrets with these placeholders.)
#
# quiz-backend-secret is created / completed by:  k8s/create-backend-secret.sh
#   - SECRET_KEY      JWT signing key, random, 32+ characters (backend refuses weaker ones in production)
#   - ADMIN_USERNAME  admin console / admin API login
#   - ADMIN_PASSWORD  random, never "admin" (backend refuses to start with it in production)
#
# quiz-db-secret already exists in the cluster (created with the first deployment) and is
# only read by the manifests. Its keys:
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD  consumed by the quiz-db deployment
#   DATABASE_URL                                   consumed by the backend
apiVersion: v1
kind: Secret
metadata:
  name: quiz-backend-secret
  namespace: quiz-game
  labels:
    app.kubernetes.io/name: quiz-backend
    app.kubernetes.io/part-of: gravitee-quiz
type: Opaque
stringData:
  SECRET_KEY: "<random 32+ chars, e.g. openssl rand -base64 48>"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "<random, e.g. openssl rand -base64 18>"
---
apiVersion: v1
kind: Secret
metadata:
  name: quiz-db-secret
  namespace: quiz-game
  labels:
    app.kubernetes.io/name: quiz-db
    app.kubernetes.io/part-of: gravitee-quiz
type: Opaque
stringData:
  POSTGRES_DB: gravitee_quiz
  POSTGRES_USER: quiz_user
  POSTGRES_PASSWORD: "<existing value - do not change: it is baked into the PostgreSQL volume>"
  DATABASE_URL: "postgresql://quiz_user:<same password>@quiz-db:5432/gravitee_quiz"
