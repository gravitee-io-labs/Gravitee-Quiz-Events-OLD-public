# Gravitee Quiz Events - "admin-console" container (admin SPA)
#
# Installed as /etc/nginx/conf.d/default.conf (http context).
# Contract: docs/ARCHITECTURE.md section 1 (/admin/), 7 (headers, caching), 8 (topology).
#
# The path is PRESERVED end to end: the gateway (compose) and the ingress (Kubernetes) forward
# /admin/... unchanged, so the SPA is served under /admin/ here too.
#
# Filesystem layout inside the container:
#   /usr/share/nginx/html/admin   admin-console/   served at /admin/
#   /usr/share/nginx/shared       shared/          served at /admin/shared/
#   /usr/share/nginx/assets       assets/          served at /admin/assets/
#   /usr/share/nginx/runtime      config.js        generated at start, served at /admin/config.js
# (separate trees = separate read-only bind mounts in dev, no nested mounts)
#
# NOTE on add_header: nginx only inherits add_header from the server level into locations that
# define NO add_header of their own. All headers are declared once, at server level.

server_tokens off;

# Same cache policy as the player app (section 7): revalidate HTML/JS/CSS/JSON, immutable media.
map $uri $quiz_cache_control {
    default                                          "no-cache";
    ~*\.(woff2?|ttf|otf|eot)$                        "public, max-age=2592000, immutable";
    ~*\.(png|jpe?g|gif|webp|avif|ico|svg|svgz)$      "public, max-age=2592000, immutable";
    ~*\.(mp3|ogg|wav|m4a)$                           "public, max-age=2592000, immutable";
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # Redirects stay relative: correct behind the gateway / ingress whatever the port or host.
    absolute_redirect off;
    port_in_redirect off;

    # Runtime values written by the entrypoint ($quiz_connect_src for the CSP).
    include /etc/nginx/quiz-runtime.conf;

    # --- MIME types (stock list + ES module / manifest extensions) -----------------
    # (a server-level "types" replaces the inherited http-level map, so re-include the stock file first)
    include /etc/nginx/mime.types;
    types {
        application/javascript  mjs;
        application/manifest+json  webmanifest;
    }
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # --- Headers --------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src $quiz_connect_src; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), bluetooth=(), camera=(), display-capture=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # The admin console must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # No "always": never put a long-lived cache header on a 404/5xx response.
    add_header Cache-Control $quiz_cache_control;

    # --- Compression -------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # --- Errors ---------------------------------------------------------------------
    error_page 403 404 =404 @notfound;

    location @notfound {
        try_files /admin/404.html @notfound_builtin;
    }

    location @notfound_builtin {
        # empty "types": ignore the extension of the missing URL (e.g. /x.png) so the body is served as HTML
        types { }
        default_type text/html;
        return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><meta name="robots" content="noindex"><title>404 - Quiz admin</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0e0b1a;color:#f4f1ff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:0 16px}h1{font-size:4rem;margin:0;color:#fc5607}p{margin:.25rem 0 1.25rem;opacity:.8}a{color:#fff;background:#fc5607;padding:.65rem 1.4rem;border-radius:999px;text-decoration:none;font-weight:600}a:focus-visible{outline:3px solid #fff;outline-offset:3px}</style></head><body><main><h1>404</h1><p>Page not found</p><a href="/admin/">Admin console</a></main></body></html>';
    }

    # --- Never serve dotfiles or the container's own build files (dev bind mounts) ------
    # A server-level "if" (not a location): the static prefixes below are ^~ locations, which would
    # skip a regex location and serve e.g. /shared/css/.hidden. $uri is already decoded and
    # normalised, so /%2ehidden and /a/./.b are caught too. "return" is the one safe use of "if".
    if ($uri ~ "/\.") {
        return 404;
    }
    location ~ ^/admin/(Dockerfile(\.dockerignore)?|nginx\.conf|docker-entrypoint\.sh)$ {
        return 404;
    }

    # --- Probes ----------------------------------------------------------------------
    # /admin-health: container probes (never routed publicly). /admin/health: same, but reachable
    # through the gateway / ingress, handy to check the path routing end to end.
    location = /admin-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /admin/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Entry points ------------------------------------------------------------------
    # Direct hits on the container root (docker run / port-forward) land on the console.
    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        try_files /admin/index.html =404;
    }

    # --- Runtime config and shared trees --------------------------------------------------
    location = /admin/config.js {
        alias /usr/share/nginx/runtime/config.js;
        default_type application/javascript;
    }

    location ^~ /admin/shared/tools/ {
        return 404;
    }
    location ^~ /admin/shared/ {
        alias /usr/share/nginx/shared/;
    }

    location ^~ /admin/assets/ {
        alias /usr/share/nginx/assets/;
    }

    # --- SPA ---------------------------------------------------------------------------
    # The console is hash-routed, so it never needs a history fallback; this one is harmless and
    # only applies to extension-less paths (a missing /admin/js/x.js stays a real 404).
    location ~ ^/admin/[^.]*$ {
        try_files /admin/index.html =404;
    }

    # Files with an extension: /admin/js/app.js, /admin/css/app.css, ...
    location /admin/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
