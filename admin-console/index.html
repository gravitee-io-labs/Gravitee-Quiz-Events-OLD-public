<!doctype html>
<html lang="en" data-theme="dark" data-bg="aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>Quiz Admin · Gravitee</title>
  <!-- sets data-theme before first paint (external classic script: CSP safe) -->
  <script src="shared/js/theme-boot.js"></script>
  <link rel="preload" href="shared/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="shared/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- design system, in this order -->
  <link rel="stylesheet" href="shared/css/fonts.css">
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/css/base.css">
  <link rel="stylesheet" href="shared/css/components.css">
  <!-- the shell (unlayered: always wins over the system) -->
  <link rel="stylesheet" href="css/admin.css">
  <!-- per-tab styles, owned by the tab authors (a missing file is a harmless 404 until it exists) -->
  <link rel="stylesheet" href="css/views/questions.css">
  <link rel="stylesheet" href="css/views/categories.css">
  <link rel="stylesheet" href="css/views/results.css">
  <link rel="stylesheet" href="css/views/settings.css">
  <link rel="stylesheet" href="css/views/appearance.css">
  <!-- runtime config written by the nginx entrypoint: window.QUIZ_CONFIG = { apiBase: "/api" } -->
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app">
    <div class="boot" role="status" aria-label="Loading"><div class="spinner"></div></div>
  </div>
  <noscript><p class="boot">The Quiz Admin console needs JavaScript.</p></noscript>
</body>
</html>
