# Gravitee Quiz Events - "web" container (hub, event game, scoreboard)
#
# Installed as /etc/nginx/conf.d/default.conf (http context).
# Contract: docs/ARCHITECTURE.md section 1 (URLs), 7 (headers, caching), 8 (topology).
#
# Filesystem layout inside the container (kept apart so each part can be a
# separate read-only bind mount in dev without nested mounts):
#   /usr/share/nginx/html     web/            served at /
#   /usr/share/nginx/shared   shared/         served at /shared/
#   /usr/share/nginx/assets   assets/         served at /assets/
#   /usr/share/nginx/runtime  config.js       generated at start, served at /config.js
#
# NOTE on add_header: nginx only inherits add_header from the server level into
# locations that define NO add_header of their own. All headers are therefore
# declared once, at server level, and no location may declare any.

server_tokens off;

# Cache policy (section 7): there are no hashed file names, so HTML/JS/CSS/JSON
# are always revalidated (ETag); fonts, icons, images and audio are immutable.
map $uri $quiz_cache_control {
    default                                          "no-cache";
    ~*\.(woff2?|ttf|otf|eot)$                        "public, max-age=2592000, immutable";
    ~*\.(png|jpe?g|gif|webp|avif|ico|svg|svgz)$      "public, max-age=2592000, immutable";
    ~*\.(mp3|ogg|wav|m4a)$                           "public, max-age=2592000, immutable";
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative: correct behind the gateway / ingress whatever the port or host.
    absolute_redirect off;
    port_in_redirect off;

    # Runtime values written by the entrypoint ($quiz_connect_src for the CSP).
    include /etc/nginx/quiz-runtime.conf;

    # --- MIME types (stock list + ES module / manifest extensions) -----------------
    # (a server-level "types" replaces the inherited http-level map, so re-include the stock file first)
    include /etc/nginx/mime.types;
    types {
        application/javascript  mjs;
        application/manifest+json  webmanifest;
    }
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # --- Headers --------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src $quiz_connect_src; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "bluetooth=(self), fullscreen=(self), accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # No "always": never put a long-lived cache header on a 404/5xx response.
    add_header Cache-Control $quiz_cache_control;

    # --- Compression -------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # --- Errors: branded 404.html if the app ships one, built-in page otherwise --------
    error_page 403 404 =404 @notfound;

    location @notfound {
        try_files /404.html @notfound_builtin;
    }

    location @notfound_builtin {
        # empty "types": ignore the extension of the missing URL (e.g. /x.png) so the body is served as HTML
        types { }
        default_type text/html;
        return 404 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>404 - Gravitee Quiz</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0e0b1a;color:#f4f1ff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:0 16px}h1{font-size:4rem;margin:0;color:#fc5607}p{margin:.25rem 0 1.25rem;opacity:.8}a{color:#fff;background:#fc5607;padding:.65rem 1.4rem;border-radius:999px;text-decoration:none;font-weight:600}a:focus-visible{outline:3px solid #fff;outline-offset:3px}</style></head><body><main><h1>404</h1><p>Page not found &middot; Page introuvable</p><a href="/">Gravitee Quiz</a></main></body></html>';
    }

    # --- Never serve dotfiles or the container's own build files (dev bind mounts) ------
    # A server-level "if" (not a location): the static prefixes below are ^~ locations, which would
    # skip a regex location and serve e.g. /shared/css/.hidden. $uri is already decoded and
    # normalised, so /%2ehidden and /a/./.b are caught too. "return" is the one safe use of "if".
    if ($uri ~ "/\.") {
        return 404;
    }
    location ~ ^/(Dockerfile(\.dockerignore)?|nginx\.conf|docker-entrypoint\.sh)$ {
        return 404;
    }

    # --- Exact files and probes (matched before anything else) --------------------------
    location = / {
        try_files /index.html =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        alias /usr/share/nginx/runtime/config.js;
        default_type application/javascript;
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.ico =404;
    }

    location = /robots.txt {
        try_files /robots.txt @robots_default;
    }

    location @robots_default {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nDisallow: /admin/\n";
    }

    # --- Static prefixes (^~ : win over the slug regexes below) ---------------------------
    location ^~ /shared/tools/ {
        return 404;
    }
    location ^~ /shared/ {
        alias /usr/share/nginx/shared/;
    }
    location ^~ /assets/ {
        alias /usr/share/nginx/assets/;
    }
    location ^~ /css/ { }
    location ^~ /js/ { }
    location ^~ /vendor/ { }
    location ^~ /fonts/ { }
    location ^~ /img/ { }
    location ^~ /images/ { }
    location ^~ /icons/ { }
    location ^~ /static/ { }

    # --- Reserved slugs are never event pages (list in ARCHITECTURE.md section 1) ---------
    location ~ ^/(api|admin|assets|shared|css|js|vendor|fonts|static|health|docs|openapi|favicon|robots|scoreboard|game|events|new|login|config|index|manifest|sw)(/.*)?$ {
        return 404;
    }

    # --- Event routes: slug = ^[a-z0-9]+(-[a-z0-9]+)*$ (length is enforced by the API) -----
    location ~ ^/[a-z0-9]+(-[a-z0-9]+)*/?$ {
        try_files /event.html =404;
    }

    location ~ ^/[a-z0-9]+(-[a-z0-9]+)*/scoreboard/?$ {
        try_files /scoreboard.html =404;
    }

    # --- Anything else: an existing static file, or 404 ------------------------------------
    location / {
        try_files $uri =404;
    }
}
